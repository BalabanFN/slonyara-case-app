<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slonyara Case - Мины</title>
    <style>
        body {
            background-color: #1a1b22;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Шапка страницы */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-back { color: #7a7c85; text-decoration: none; font-size: 16px; font-weight: 500; }
        .stars-badge { background: #252631; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; border: 1px solid #292a34; }

        /* Игровое поле */
        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            min-height: 280px;
        }

        .mines-board {
            display: grid;
            gap: 8px;
            background-color: #121318;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .mine-cell {
            background-color: #2d2d35;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #7a7c85;
            cursor: pointer;
            aspect-ratio: 1;
            transition: background-color 0.15s, transform 0.1s;
        }
        .mine-cell:active { transform: scale(0.92); }
        .mine-cell.opened-crown { background-color: #212123; color: #ffaa00; }
        .mine-cell.opened-bomb { background-color: #ff3b30; color: #ffffff; }

        /* Панель под полем */
        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            max-width: 320px;
            margin: 0 auto 20px auto;
        }

        .btn-history-trigger {
            background-color: #252631; border: 1px solid #292a34; color: #ffffff;
            border-radius: 12px; width: 40px; height: 38px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        .size-selector {
            display: flex; background-color: #252631; border-radius: 12px;
            padding: 4px; flex-grow: 1; border: 1px solid #292a34; height: 38px; box-sizing: border-box;
        }

        .size-btn {
            flex: 1; background: none; border: none; color: #7a7c85;
            font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 8px;
        }
        .size-btn.active { background-color: #121318; color: #ffffff; }

        /* ВСПЛЫВАЮЩЕЕ ОКНО "НОВАЯ СТАВКА" (ТОЧНО ПО СКРИНШОТУ) */
        .bet-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 19, 24, 0.95);
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 150;
        }

        .bet-modal-header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 40px;
        }
        .bet-modal-title { font-size: 18px; font-weight: bold; }
        .bet-modal-close { position: absolute; right: 0; font-size: 18px; color: #7a7c85; cursor: pointer; }

        /* Ввод суммы */
        .bet-value-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        .bet-currency-label { font-size: 16px; color: #7a7c85; text-align: center; margin-bottom: 25px; }

        /* Кнопки быстрого добавления ставок */
        .quick-bet-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .quick-bet-btn {
            background-color: #252631;
            border: 1px solid #292a34;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .bet-limits-text { font-size: 12px; color: #55565f; text-align: center; margin-bottom: auto; }

        /* Настройка количества мин внизу */
        .mines-config-card {
            background-color: #212123;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #292a34;
        }
        .mines-config-header {
            display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 5px;
        }
        .mines-config-desc { font-size: 11px; color: #55565f; text-align: left; margin-bottom: 15px; line-height: 1.3; }
        
        /* Слайдер-ползунок */
        .mines-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #2d2d35;
            border-radius: 3px;
            outline: none;
        }
        .mines-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #246bfd;
            cursor: pointer;
        }

        /* Синяя нижняя кнопка */
        .bottom-container {
            position: fixed; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; padding: 0 15px; box-sizing: border-box;
        }
        .btn-action {
            background-color: #246bfd; color: white; border: none;
            border-radius: 16px; padding: 15px 0; font-size: 16px;
            font-weight: bold; width: 100%; max-width: 360px; cursor: pointer;
        }
        /* Стиль для кнопки ошибки баланса */
        .btn-action.insufficient {
            background-color: #ff3b30 !important;
            color: #ffffff;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-cashout { background-color: #4cd964; color: #000; }

        /* Модалка истории */
        .history-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 19, 24, 0.95); display: none; flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 200;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="index.html" class="btn-back">← Назад</a>
        <!-- Установили текущий баланс 36 звезд, как на твоем скриншоте -->
        <div class="stars-badge">⭐ <span id="user-balance">0</span></div>
    </div>

    <div class="board-container">
        <div id="board" class="mines-board"></div>
    </div>

    <div class="controls-row">
        <div class="btn-history-trigger" onclick="openHistoryModal()">🕒</div>
        <div class="size-selector">
            <button class="size-btn" onclick="changeSize(3, this)">3x3</button>
            <button class="size-btn active" onclick="changeSize(5, this)">5x5</button>
            <button class="size-btn" onclick="changeSize(7, this)">7x7</button>
        </div>
    </div>

    <div class="bottom-container">
        <button class="btn-action" id="action-btn" onclick="openBetModal()">Сделать ставку</button>
    </div>

    <!-- ОКНО "НОVАЯ СТАВКА" -->
    <div class="bet-modal-overlay" id="betModal">
        <div class="bet-modal-header">
            <div class="bet-modal-title">Новая ставка</div>
            <div class="bet-modal-close" onclick="closeBetModal()">✕</div>
        </div>

        <!-- Показ баланса внутри модалки -->
        <div style="display:flex; justify-content:center; margin-bottom: 10px;">
            <div class="stars-badge">⭐ <span id="modal-balance-view">0</span> <span style="color:#246bfd; margin-left:5px;">+</span></div>
        </div>

        <!-- Крупный счетчик ввода ставки -->
        <div class="bet-value-display" id="bet-amount-text">0</div>
        <div class="bet-currency-label">stars</div>

        <!-- Кнопки быстрого добавления -->
        <div class="quick-bet-row">
            <button class="quick-bet-btn" onclick="addBet(100)">+ 100</button>
            <button class="quick-bet-btn" onclick="addBet(500)">+ 500</button>
            <button class="quick-bet-btn" onclick="addBet(2500)">+ 2500</button>
        </div>
        <div class="bet-limits-text">От 50 до 10 000 звезд</div>

        <!-- Конфигуратор количества мин из скриншота -->
        <div class="mines-config-card">
            <div class="mines-config-header">
                <span>Количество мин</span>
                <span id="mines-count-view" style="background:#2d2d35; padding:2px 8px; border-radius:8px;">3</span>
            </div>
            <div class="mines-config-desc">
                Чем больше мин, тем быстрее будет расти банк, но и выше риск.
            </div>
            <input type="range" min="1" max="24" value="3" class="mines-slider" id="minesSlider" oninput="updateMinesCount(this.value)">
        </div>

        <!-- Кнопка отправки ставки / Ошибка баланса -->
        <button class="btn-action" id="submit-bet-btn" onclick="confirmAndStartGame()" style="position:relative; width:100%; margin-bottom:15px;">Отправить ставку</button>
    </div>

    <!-- Окно истории -->
    <div class="history-overlay" id="historyModal">
        <div style="text-align:center; position:relative; margin-bottom:30px;">

    <!-- ОКНО ИСТОРИИ ИГР -->
    <div class="history-overlay" id="historyModal">
        <div style="text-align:center; position:relative; margin-bottom:30px;">
            <div style="font-size:22px; font-weight:bold;">История игр</div>
            <div style="font-size:13px; color:#7a7c85;">Последние 50 раундов</div>
            <div class="bet-modal-close" onclick="closeHistoryModal()">✕</div>
        </div>
        <div id="history-content" style="background:#212123; border-radius:20px; padding:30px 20px; text-align:center; margin:auto; max-width:340px; border: 1px solid #292a34;">
            <div style="font-size:16px; font-weight:bold; margin-bottom:6px;">Ничего нет</div>
            <div style="font-size:13px; color:#7a7c85;">Вы еще не играли</div>
        </div>
    </div>

    <script>
        let currentSize = 5;
        let gameState = "waiting"; 
        let totalCells = 25;
        
        // Стартовый баланс игрока теперь строго равен 0
        let userBalance = 0; 
        
        let currentBet = 0;
        let bombsCount = 3; 
        let bombPositions = [];
        let openedCrowns = 0;
        let currentPayout = 1.00;

        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            totalCells = currentSize * currentSize;
            let boardWidth = currentSize === 3 ? 200 : (currentSize === 5 ? 260 : 300);
            board.style.width = boardWidth + 'px';

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell'; 
                cell.innerText = '?'; 
                cell.dataset.index = i;
                cell.onclick = () => handleCellClick(cell);
                board.appendChild(cell);
            }
        }

        function changeSize(size, btnElement) {
            if (gameState === "playing") return;
            currentSize = size;
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            const slider = document.getElementById('minesSlider');
            slider.max = (size * size) - 1;
            if(parseInt(slider.value) > slider.max) {
                slider.value = slider.max;
                updateMinesCount(slider.value);
            }
            initBoard();
        }

        function openBetModal() {
            if (gameState === "playing") {
                alert(`🎉 Вы забрали выигрыш! Получено: ⭐ ${(currentBet * currentPayout).toFixed(0)}`);
                userBalance += Math.floor(currentBet * currentPayout);
                document.getElementById('user-balance').innerText = userBalance;
                document.getElementById('modal-balance-view').innerText = userBalance;
                resetGame();
                return;
            }
            document.getElementById('betModal').style.display = 'flex';
            checkBetValidity();
        }

        function closeBetModal() { document.getElementById('betModal').style.display = 'none'; }

        function addBet(amount) {
            currentBet += amount;
            document.getElementById('bet-amount-text').innerText = currentBet;
            checkBetValidity();
        }

        function updateMinesCount(val) {
            bombsCount = parseInt(val);
            document.getElementById('mines-count-view').innerText = bombsCount;
        }

        function checkBetValidity() {
            const btn = document.getElementById('submit-bet-btn');
            if (currentBet > userBalance) {
                btn.innerText = "Недостаточно звезд";
                btn.className = "btn-action insufficient";
                btn.disabled = true;
            } else if (currentBet < 50 && currentBet > 0) {
                btn.innerText = "Мин. ставка 50 звезд";
                btn.className = "btn-action insufficient";
                btn.disabled = true;
            } else {
                btn.innerText = "Отправить ставку";
                btn.className = "btn-action";
                btn.disabled = false;
            }
        }

        function confirmAndStartGame() {
            if (currentBet === 0) { alert("Выберите сумму ставки!"); return; }
            
            userBalance -= currentBet;
            document.getElementById('user-balance').innerText = userBalance;
            document.getElementById('modal-balance-view').innerText = userBalance;
            
            gameState = "playing";
            openedCrowns = 0;
            currentPayout = 1.00;
            initBoard();

            bombPositions = [];
            while(bombPositions.length < bombsCount) {
                let pos = Math.floor(Math.random() * totalCells);
                if(!bombPositions.includes(pos)) bombPositions.push(pos);
            }

            closeBetModal();
            
            const mainBtn = document.getElementById('action-btn');
            mainBtn.innerText = `Забрать (x1.00)`;
            mainBtn.className = "btn-action btn-cashout";
        }

        function handleCellClick(cell) {
            if (gameState !== "playing") return;
            if (cell.classList.contains('opened-crown') || cell.classList.contains('opened-bomb')) return;

            let index = parseInt(cell.dataset.index);

            if (bombPositions.includes(index)) {
                cell.classList.add('opened-bomb'); 
                cell.innerText = '💣';
                alert("💥 Бомба! Ваша ставка сгорела.");
                revealAll();
                resetGame();
            } else {
                cell.classList.add('opened-crown'); 
                cell.innerText = '👑';
                openedCrowns++;
                
                currentPayout += 0.10 * bombsCount * (1 + openedCrowns * 0.1);
                document.getElementById('action-btn').innerText = `Забрать (x${currentPayout.toFixed(2)})`;
                
                if (openedCrowns === totalCells - bombsCount) {
                    alert("🏆 Чистая победа! Вы открыли все сейфы!");
                    userBalance += Math.floor(currentBet * currentPayout);
                    document.getElementById('user-balance').innerText = userBalance;
                    resetGame();
                }
            }
        }

        function revealAll() {
            document.querySelectorAll('.mine-cell').forEach((cell, idx) => {
                if (bombPositions.includes(idx)) { cell.classList.add('opened-bomb'); cell.innerText = '💣'; }
                else if (!cell.classList.contains('opened-crown')) { cell.style.opacity = "0.4"; cell.innerText = '👑'; }
            });
        }

        function resetGame() {
            gameState = "waiting";
            currentBet = 0;
            document.getElementById('bet-amount-text').innerText = "0";
            const btn = document.getElementById('action-btn');
            btn.innerText = "Сделать ставку";
            btn.className = "btn-action";
        }

        function openHistoryModal() { document.getElementById('historyModal').style.display = 'flex'; }
        function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }

        initBoard();
    </script>
</body>
</html>
