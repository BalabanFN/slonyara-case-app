<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slonyara Case - Пополнение</title>
    <style>
        body {
            background-color: #121318;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 110px;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            text-align: center;
        }

        /* Шапка страницы */
        .header-container {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .btn-back { position: absolute; left: 5px; top: 0; font-size: 16px; color: #7a7c85; text-decoration: none; font-weight: 500; }
        .title { font-size: 20px; font-weight: bold; margin: 0; }

        /* Горизонтальный таббар способов оплаты из макета */
        .methods-scroller {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 5px 0;
            margin-bottom: 50px;
        }
        .methods-scroller::-webkit-scrollbar { display: none; }
        
        .method-btn {
            background-color: #1b1c24;
            border: 1px solid #292a34;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .method-btn.active {
            background-color: #246bfd;
            border-color: #246bfd;
        }

        /* Центральный контент */
        .amount-display {
            font-size: 56px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .star-icon { color: #ffaa00; font-size: 48px; }

        .rate-calc-text {
            font-size: 13px;
            color: #7a7c85;
            margin-bottom: auto;
        }

        /* Нижний блок управления кнопками */
        .bottom-controls-container {
            position: fixed; bottom: 20px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding: 0 15px; box-sizing: border-box; gap: 12px;
            z-index: 20;
        }
        
        .quick-chips-row { display: flex; gap: 8px; width: 100%; max-width: 340px; }
        
        .chip-btn {
            flex: 1; background-color: #212123; border: 1px solid #292a34;
            color: white; padding: 10px 0; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer;
        }

        .btn-action {
            background-color: #246bfd; color: white; border: none;
            border-radius: 16px; padding: 15px 0; font-size: 16px;
            font-weight: bold; width: 100%; max-width: 340px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(36, 107, 253, 0.4);
            transition: background-color 0.2s;
        }
        .btn-action.crypto-bot-style {
            background: linear-gradient(135deg, #1098ad, #0b6977);
            box-shadow: 0 4px 15px rgba(11, 105, 119, 0.4);
        }
    </style>
</head>
<body>

    <!-- Шапка страницы -->
    <div class="header-container">
        <a href="index.html" class="btn-back">← Назад</a>
        <h1 class="title">Пополнение баланса</h1>
    </div>

    <!-- Таббар способов оплаты из макета -->
    <div class="methods-scroller">
        <button class="method-btn active" onclick="setPaymentMethod('gram', this)">🔹 GRAM</button>
        <button class="method-btn" onclick="setPaymentMethod('stars', this)">⭐ Звездами</button>
        <button class="method-btn" onclick="setPaymentMethod('gifts', this)">🎁 Подарками</button>
        <button class="method-btn" onclick="setPaymentMethod('crypto', this)">🟢 Крипта</button>
    </div>

    <!-- Центральный счетчик звезд (Изначально выставлено 200 по макету) -->
    <div class="amount-display">
        <span id="deposit-amount">200</span>
        <span class="star-icon">★</span>
    </div>
    <div class="rate-calc-text" id="rate-text">~ 1,79 GRAM (-10%)</div>

    <!-- Панель быстрых кнопок и подтверждения -->
    <div class="bottom-controls-container">
        <div class="quick-chips-row">
            <button class="chip-btn" onclick="addValue(500)">+ 500</button>
            <button class="chip-btn" onclick="addValue(2000)">+ 2 000</button>
            <button class="chip-btn" onclick="addValue(5000)">+ 5 000</button>
        </div>
        <button class="btn-action crypto-bot-style" id="main-action-btn" onclick="handlePaymentSubmit()">Оплатить через Crypto Bot</button>
    </div>

    <script>
        let currentAmount = 200;
        let selectedMethod = 'gram';

        function addValue(val) {
            currentAmount += val;
            document.getElementById('deposit-amount').innerText = currentAmount.toLocaleString('ru-RU');
            calculateRate();
        }

        function setPaymentMethod(method, btnElement) {
            selectedMethod = method;
            document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const mainBtn = document.getElementById('main-action-btn');

            if (method === 'stars') {
                mainBtn.innerText = 'Оплатить через Telegram Stars';
                mainBtn.className = 'btn-action'; // Обычный синий цвет
            } else if (method === 'gifts') {
                mainBtn.innerText = 'Обменять подарки';
                mainBtn.className = 'btn-action';
            } else if (method === 'crypto') {
                mainBtn.innerText = 'Оплатить через Crypto Bot (USDT/TON)';
                mainBtn.className = 'btn-action crypto-bot-style'; // Специфический стиль крипты
            } else {
                // GRAM метод по умолчанию
                mainBtn.innerText = 'Оплатить через Crypto Bot (GRAM)';
                mainBtn.className = 'btn-action crypto-bot-style';
            }
            calculateRate();
        }

        function calculateRate() {
            const rateText = document.getElementById('rate-text');
            if (selectedMethod === 'stars') {
                rateText.innerText = 'Стоимость: ' + currentAmount + ' Telegram Stars';
            } else if (selectedMethod === 'crypto') {
                let usdtValue = (currentAmount * 0.01).toFixed(2);
                rateText.innerText = '~ ' + usdtValue + ' USDT';
            } else if (selectedMethod === 'gifts') {
                rateText.innerText = 'Выберите ценные NFT для конвертации';
            } else {
                // Точный расчет для GRAM со скидкой из скриншота
                let gramValue = (currentAmount * 0.0089).toFixed(2);
                rateText.innerText = '~ ' + gramValue + ' GRAM (-10%)';
            }
        }

        function handlePaymentSubmit() {
            if (selectedMethod === 'stars') {
                alert('Бэкенд-бот GG Case отправил официальный инвойс на оплату ' + currentAmount + ' звезд в ваш чат!');
                return;
            }
            if (selectedMethod === 'gifts') {
                alert('Открытие инвентаря для выбора сжигаемых подарков...');
                return;
            }

            // Логика интеграции с Crypto Bot
            let currencyName = selectedMethod === 'gram' ? 'GRAM' : 'USDT/TON';
            alert('Crypto Bot API генерирует счет на оплату в валюте ' + currencyName + '. Ссылка на оплату отправлена в чат вашего бота GG Case!');
        }

        calculateRate();
    </script>
</body>
</html>
