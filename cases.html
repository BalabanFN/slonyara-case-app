<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Case - Кейсы</title>
    <style>
        body {
            background-color: #121318;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Шапка окна */
        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            padding: 5px 0;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
        }

        .btn-close {
            position: absolute;
            right: 5px;
            font-size: 18px;
            color: #7a7c85;
            text-decoration: none;
            cursor: pointer;
        }

        /* Сетка кейсов 2х2 с вертикальной прокруткой */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
            padding-bottom: 30px;
        }

        /* Убираем полосу прокрутки для нативности */
        .cases-grid::-webkit-scrollbar {
            display: none;
        }

        /* Карточка кейса */
        .case-card {
            background-color: #212123;
            border-radius: 18px;
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
            box-sizing: border-box;
        }

        .case-card:active {
            transform: scale(0.96);
            background-color: #27272a;
        }

        /* Тег Лимит */
        .limit-badge {
            position: absolute;
            top: 10px;
            background: linear-gradient(135deg, #007aff, #0055cc);
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Контейнер для картинки подарка */
        .image-box {
            width: 90px;
            height: 90px;
            margin-top: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .case-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Текстовый подвал карточки */
        .case-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 4px;
            box-sizing: border-box;
            align-items: center;
        }

        .case-name {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
        }

        .case-price {
            font-size: 14px;
            font-weight: bold;
            color: #ffaa00;
            display: flex;
            align-items: center;
            gap: 3px;
        }
    </style>
</head>
<body>

    <!-- Шапка страницы кейсов -->
    <div class="header-container">
        <div class="header-title">Кейсы</div>
        <!-- Кнопка Х возвращает на главную index.html -->
        <a href="index.html" class="btn-close">✕</a>
    </div>

    <!-- Сетка с кейсами из Gorilla Case -->
    <div class="cases-grid">

        <!-- Mirage -->
        <div class="case-card" onclick="buyCase('Mirage', 249)">
            <div class="limit-badge">Лимит</div>
            <div class="image-box"><span style="font-size: 60px;">🕌</span></div>
            <div class="case-info">
                <span class="case-name">Mirage</span>
                <span class="case-price">⭐ 249</span>
            </div>
        </div>

        <!-- Lamp -->
        <div class="case-card" onclick="buyCase('Lamp (Limit)', 399)">
            <div class="limit-badge">Лимит</div>
            <div class="image-box"><span style="font-size: 60px;">🏮</span></div>
            <div class="case-info">
                <span class="case-name">Lamp</span>
                <span class="case-price">⭐ 399</span>
            </div>
        </div>

        <!-- Lucky -->
        <div class="case-card" onclick="buyCase('Lucky', 499)">
            <div class="limit-badge">Лимит</div>
            <div class="image-box"><span style="font-size: 60px;">🐱</span></div>
            <div class="case-info">
                <span class="case-name">Lucky</span>
                <span class="case-price">⭐ 499</span>
            </div>
        </div>

        <!-- Locket -->
        <div class="case-card" onclick="buyCase('Locket', 999)">
            <div class="limit-badge">Лимит</div>
            <div class="image-box"><span style="font-size: 60px;">🐈‍⬛</span></div>
            <div class="case-info">
                <span class="case-name">Locket</span>
                <span class="case-price">⭐ 999</span>
            </div>
        </div>

        <!-- Bear -->
        <div class="case-card" onclick="buyCase('Bear', 149)">
            <div class="image-box"><span style="font-size: 60px;">🧸</span></div>
            <div class="case-info">
                <span class="case-name">Bear</span>
                <span class="case-price">⭐ 149</span>
            </div>
        </div>

        <!-- Player -->
        <div class="case-card" onclick="buyCase('Player', 199)">
            <div class="image-box"><span style="font-size: 60px;">🎮</span></div>
            <div class="case-info">
                <span class="case-name">Player</span>
                <span class="case-price">⭐ 199</span>
            </div>
        </div>

    </div>

    <script>
        function buyCase(name, price) {
            alert(`Вы выбрали кейс: ${name} за ${price} Stars. На бэкенд отправлен запрос покупки!`);
        }
    </script>
</body>
</html>
